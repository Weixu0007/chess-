<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 国际象棋 - 完美联机版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Three.js 3D 引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Chess.js 规则引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <!-- PeerJS 网络通信库 -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; }
        #canvas-container { width: 100vw; height: 100vh; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-white font-sans select-none">

    <div id="canvas-container"></div>

    <!-- UI 面板 -->
    <div class="absolute top-6 left-6 z-10 glass-panel p-6 rounded-2xl shadow-2xl max-w-sm w-full">
        <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-amber-200 to-yellow-500">
            3D 极致光影国际象棋
        </h1>

        <!-- 模式选择 -->
        <div class="mt-4 flex bg-slate-800/80 p-1 rounded-xl border border-slate-700">
            <button id="mode-offline" class="flex-1 py-1.5 text-xs font-semibold rounded-lg bg-amber-500 text-slate-950 transition">
                线下双人
            </button>
            <button id="mode-online" class="flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition">
                线上联网
            </button>
        </div>

        <!-- 线上控制区（只需要一个房间号） -->
        <div id="online-controls" class="hidden mt-4 pt-3 border-t border-slate-700/50">
            <div class="flex gap-2 mb-2">
                <input id="room-id-input" type="text" placeholder="输入自定义房间号" class="flex-1 px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white focus:outline-none focus:border-amber-500">
            </div>
            <div class="flex gap-2">
                <button id="create-room-btn" class="flex-1 py-1.5 bg-amber-500 text-slate-950 text-xs font-bold rounded-lg hover:bg-amber-400 transition">创建(执白)</button>
                <button id="join-room-btn" class="flex-1 py-1.5 bg-slate-700 text-slate-200 text-xs font-bold rounded-lg hover:bg-slate-600 transition">加入(执黑)</button>
            </div>
            <div id="conn-status" class="text-[11px] mt-2 text-slate-400">状态: 未连接</div>
        </div>

        <!-- 棋局状态 display -->
        <div class="mt-4 border-t border-slate-700/50 pt-3">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs text-slate-300">当前回合：</span>
                <span id="turn-display" class="px-2.5 py-0.5 bg-amber-500/20 text-amber-300 text-xs rounded-full font-semibold border border-amber-500/30">
                    白方
                </span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-xs text-slate-300">局势状态：</span>
                <span id="status-display" class="text-xs text-emerald-400 font-medium">进行中</span>
            </div>
        </div>

        <div class="mt-4 flex gap-2">
            <button id="reset-btn" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-xl border border-slate-700 transition">
                重新开始 (双方同步)
            </button>
            <button id="flip-btn" class="py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-xl border border-slate-700 transition">
                翻转视角
            </button>
        </div>
    </div>

    <script>
        // --- 1. 全局变量与状态 ---
        const game = new Chess();
        let gameMode = 'offline';
        let myColor = 'w';
        let peer = null;
        let conn = null;

        // --- 2. Three.js 场景渲染 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f19);
        scene.fog = new THREE.FogExp2(0x0b0f19, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.target.set(0, 0, 0);

        // 灯光
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const dirLight = new THREE.DirectionalLight(0xfffaed, 1.5);
        dirLight.position.set(8, 15, 8);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.5);
        fillLight.position.set(-8, 10, -8);
        scene.add(fillLight);

        // 材质定义
        const darkSquareMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3 });
        const lightSquareMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.2 });
        const whitePieceMat = new THREE.MeshPhysicalMaterial({ color: 0xf8fafc, roughness: 0.15, clearcoat: 0.8 });
        const blackPieceMat = new THREE.MeshPhysicalMaterial({ color: 0x0f172a, roughness: 0.2, clearcoat: 0.5 });
        
        // 高亮材质
        const moveMat = new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.6 }); // 可走范围 (绿)
        const checkMat = new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.8 }); // 被将军提示 (红)

        // 棋盘绘制
        const boardGroup = new THREE.Group();
        const squareSize = 1;
        const boardOffset = 3.5;
        const squares = {};

        const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(9, 0.4, 9), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
        baseMesh.position.y = -0.21;
        baseMesh.receiveShadow = true;
        boardGroup.add(baseMesh);

        for (let x = 0; x < 8; x++) {
            for (let z = 0; z < 8; z++) {
                const isDark = (x + z) % 2 === 1;
                const square = new THREE.Mesh(new THREE.BoxGeometry(1, 0.2, 1), isDark ? darkSquareMat : lightSquareMat);
                square.position.set(x - boardOffset, -0.1, z - boardOffset);
                square.receiveShadow = true;
                const squareName = String.fromCharCode(97 + x) + (8 - z);
                square.userData = { squareName };
                squares[squareName] = square;
                boardGroup.add(square);
            }
        }
        scene.add(boardGroup);

        // 棋子 Mesh 构造
        function createPieceGeometry(type) {
            const group = new THREE.Group();
            const base = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 0.15, 32));
            base.position.y = 0.075;
            
            switch (type.toLowerCase()) {
                case 'p':
                    const pBody = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.6, 32));
                    pBody.position.y = 0.45;
                    const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.2, 32, 32));
                    pHead.position.y = 0.8;
                    group.add(base, pBody, pHead);
                    break;
                case 'r':
                    const rBody = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.35, 0.7, 32));
                    rBody.position.y = 0.5;
                    const rTop = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.3, 0.2, 8));
                    rTop.position.y = 0.9;
                    group.add(base, rBody, rTop);
                    break;
                case 'n':
                    const nBody = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.6, 0.4));
                    nBody.position.y = 0.5;
                    const nHead = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16));
                    nHead.position.set(0, 0.75, 0.1);
                    group.add(base, nBody, nHead);
                    break;
                case 'b':
                    const bBody = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.35, 0.8, 32));
                    bBody.position.y = 0.55;
                    const bTop = new THREE.Mesh(new THREE.SphereGeometry(0.2, 32, 32));
                    bTop.scale.set(1, 1.4, 1);
                    bTop.position.y = 0.95;
                    group.add(base, bBody, bTop);
                    break;
                case 'q':
                    const qBody = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.38, 1.0, 32));
                    qBody.position.y = 0.65;
                    const qCrown = new THREE.Mesh(new THREE.SphereGeometry(0.28, 32, 32));
                    qCrown.position.y = 1.2;
                    group.add(base, qBody, qCrown);
                    break;
                case 'k':
                    const kBody = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.4, 1.1, 32));
                    kBody.position.y = 0.7;
                    const kCross = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.1));
                    kCross.position.y = 1.35;
                    group.add(base, kBody, kCross);
                    break;
            }

            group.traverse(child => { if (child.isMesh) child.castShadow = true; });
            return group;
        }

        let piecesInScene = [];
        let highlights = [];

        function clearHighlights() {
            highlights.forEach(h => scene.remove(h));
            highlights = [];
        }

        // 渲染棋盘上的棋子
        function renderPieces() {
            piecesInScene.forEach(p => scene.remove(p));
            piecesInScene = [];

            const board = game.board();
            let kingSquareInCheck = null;

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (piece) {
                        const pieceMesh = createPieceGeometry(piece.type);
                        const mat = piece.color === 'w' ? whitePieceMat : blackPieceMat;
                        pieceMesh.traverse(child => { if (child.isMesh) child.material = mat; });

                        pieceMesh.position.set(c - boardOffset, 0, r - boardOffset);
                        if (piece.color === 'b') pieceMesh.rotation.y = Math.PI;

                        const sqName = String.fromCharCode(97 + c) + (8 - r);
                        pieceMesh.userData = { square: sqName };
                        scene.add(pieceMesh);
                        piecesInScene.push(pieceMesh);

                        // 记录处于将军状态的“王”的格子
                        if (game.in_check() && piece.type === 'k' && piece.color === game.turn()) {
                            kingSquareInCheck = sqName;
                        }
                    }
                }
            }

            // 更新将军红框高亮
            clearHighlights();
            if (kingSquareInCheck && squares[kingSquareInCheck]) {
                const geo = new THREE.RingGeometry(0.2, 0.45, 32);
                const mesh = new THREE.Mesh(geo, checkMat);
                mesh.rotation.x = -Math.PI / 2;
                mesh.position.set(squares[kingSquareInCheck].position.x, 0.02, squares[kingSquareInCheck].position.z);
                scene.add(mesh);
                highlights.push(mesh);
            }

            updateUI();
        }

        // 显示棋子可走的合法范围（自动防御将军状态）
        function showLegalMoves(fromSquare) {
            clearHighlights();
            // 重新保留将军警示红框
            if (game.in_check()) {
                const board = game.board();
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const p = board[r][c];
                        if (p && p.type === 'k' && p.color === game.turn()) {
                            const sq = String.fromCharCode(97 + c) + (8 - r);
                            const geo = new THREE.RingGeometry(0.2, 0.45, 32);
                            const mesh = new THREE.Mesh(geo, checkMat);
                            mesh.rotation.x = -Math.PI / 2;
                            mesh.position.set(squares[sq].position.x, 0.02, squares[sq].position.z);
                            scene.add(mesh);
                            highlights.push(mesh);
                        }
                    }
                }
            }

            // 获取该格子棋子的所有合法走法
            const moves = game.moves({ square: fromSquare, verbose: true });
            moves.forEach(m => {
                const targetSq = squares[m.to];
                if (targetSq) {
                    const geo = new THREE.CircleGeometry(0.2, 32);
                    const mesh = new THREE.Mesh(geo, moveMat);
                    mesh.rotation.x = -Math.PI / 2;
                    mesh.position.set(targetSq.position.x, 0.02, targetSq.position.z);
                    scene.add(mesh);
                    highlights.push(mesh);
                }
            });
        }

        // --- 3. 交互逻辑 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let selectedSquare = null;

        function onPointerDown(event) {
            if (event.button !== 0) return;
            // 线上模式：只能在属于自己的回合操作
            if (gameMode === 'online' && game.turn() !== myColor) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(scene.children, true);
            if (intersects.length > 0) {
                let clickedSquare = null;
                for (let hit of intersects) {
                    let obj = hit.object;
                    while (obj.parent && obj.parent !== scene && !obj.userData.squareName) {
                        if (obj.userData.square) { clickedSquare = obj.userData.square; break; }
                        obj = obj.parent;
                    }
                    if (clickedSquare) break;
                    if (obj.userData.squareName) { clickedSquare = obj.userData.squareName; break; }
                }

                if (clickedSquare) handleSquareClick(clickedSquare);
            }
        }

        function handleSquareClick(sq) {
            if (game.game_over()) return;

            if (selectedSquare === null) {
                const piece = game.get(sq);
                if (piece && (gameMode === 'offline' ? piece.color === game.turn() : piece.color === myColor)) {
                    selectedSquare = sq;
                    showLegalMoves(sq); // 显示可走范围
                }
            } else {
                // 尝试移动
                const move = game.move({ from: selectedSquare, to: sq, promotion: 'q' });

                if (move !== null) {
                    selectedSquare = null;
                    renderPieces();

                    // 线上同步当前局面 (发送完整 FEN 码，保证完美同步)
                    if (gameMode === 'online' && conn) {
                        conn.send({ type: 'sync_board', fen: game.fen() });
                    }
                } else {
                    // 如果点击了另一个属于自己的棋子，切换选中目标
                    const piece = game.get(sq);
                    if (piece && (gameMode === 'offline' ? piece.color === game.turn() : piece.color === myColor)) {
                        selectedSquare = sq;
                        showLegalMoves(sq);
                    } else {
                        selectedSquare = null;
                        clearHighlights();
                    }
                }
            }
        }

        // --- 4. 优化后的 WebRTC 联机模块（使用单一房间号） ---
        function getRoomId() {
            return document.getElementById('room-id-input').value.trim();
        }

        // 房主创建房间 (执白)
        document.getElementById('create-room-btn').addEventListener('click', () => {
            const roomId = getRoomId();
            if (!roomId) return alert("请输入房间号！");

            if (peer) peer.destroy();
            // 使用自定义 roomId 注册 Peer
            peer = new Peer('chess-room-' + roomId);

            peer.on('open', () => {
                myColor = 'w';
                document.getElementById('conn-status').innerText = "房间创建成功，等待对方加入...";
                document.getElementById('conn-status').className = "text-[11px] mt-2 text-amber-400 font-bold";
                rotateCameraForColor('w');
            });

            peer.on('connection', c => {
                conn = c;
                setupConnection();
                document.getElementById('conn-status').innerText = "对方已加入！你是【白方】";
                document.getElementById('conn-status').className = "text-[11px] mt-2 text-emerald-400 font-bold";
                // 重置并同步棋局给加入者
                game.reset();
                renderPieces();
                conn.send({ type: 'sync_board', fen: game.fen() });
            });

            peer.on('error', err => {
                if (err.type === 'unavailable-id') {
                    alert("该房间号已被创建，请换一个房间号或点击【加入】");
                } else {
                    alert("建立房间失败: " + err.type);
                }
            });
        });

        // 玩家加入房间 (执黑)
        document.getElementById('join-room-btn').addEventListener('click', () => {
            const roomId = getRoomId();
            if (!roomId) return alert("请输入房间号！");

            if (peer) peer.destroy();
            peer = new Peer(); // 随机生成客户端 Peer ID

            peer.on('open', () => {
                conn = peer.connect('chess-room-' + roomId);
                myColor = 'b';
                setupConnection();
                document.getElementById('conn-status').innerText = "正在连接房间...";
            });
        });

        function setupConnection() {
            conn.on('open', () => {
                if (myColor === 'b') {
                    document.getElementById('conn-status').innerText = "成功加入房间！你是【黑方】";
                    document.getElementById('conn-status').className = "text-[11px] mt-2 text-emerald-400 font-bold";
                    rotateCameraForColor('b');
                }
            });

            // 核心修复：通过 FEN 强行全面同步棋盘状态，解决复原与不同步问题
            conn.on('data', data => {
                if (data.type === 'sync_board') {
                    game.load(data.fen);
                    selectedSquare = null;
                    renderPieces();
                }
            });

            conn.on('close', () => {
                document.getElementById('conn-status').innerText = "对方已断开连接";
                document.getElementById('conn-status').className = "text-[11px] mt-2 text-rose-400";
            });
        }

        function rotateCameraForColor(color) {
            camera.position.set(0, 12, color === 'b' ? -12 : 12);
            controls.target.set(0, 0, 0);
        }

        // --- 5. UI 与模式事件绑定 ---
        document.getElementById('mode-offline').addEventListener('click', () => {
            gameMode = 'offline';
            document.getElementById('mode-offline').className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-amber-500 text-slate-950 transition";
            document.getElementById('mode-online').className = "flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition";
            document.getElementById('online-controls').classList.add('hidden');
        });

        document.getElementById('mode-online').addEventListener('click', () => {
            gameMode = 'online';
            document.getElementById('mode-online').className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-amber-500 text-slate-950 transition";
            document.getElementById('mode-offline').className = "flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition";
            document.getElementById('online-controls').classList.remove('hidden');
        });

        document.getElementById('flip-btn').addEventListener('click', () => {
            camera.position.z = -camera.position.z;
            controls.target.set(0, 0, 0);
        });

        // 重置棋局事件
        document.getElementById('reset-btn').addEventListener('click', () => {
            game.reset();
            selectedSquare = null;
            renderPieces();

            // 线上模式同步发送全新的初始化 FEN 给对方
            if (gameMode === 'online' && conn) {
                conn.send({ type: 'sync_board', fen: game.fen() });
            }
        });

        function updateUI() {
            const turnDisp = document.getElementById('turn-display');
            const statusDisp = document.getElementById('status-display');

            turnDisp.innerText = game.turn() === 'w' ? "白方" : "黑方";
            
            if (game.in_checkmate()) {
                statusDisp.innerText = "将死！游戏结束";
                statusDisp.className = "text-xs text-rose-500 font-bold";
            } else if (game.in_draw()) {
                statusDisp.innerText = "平局";
                statusDisp.className = "text-xs text-amber-400 font-bold";
            } else if (game.in_check()) {
                statusDisp.innerText = "将军！";
                statusDisp.className = "text-xs text-rose-400 font-bold";
            } else {
                statusDisp.innerText = "进行中";
                statusDisp.className = "text-xs text-emerald-400 font-medium";
            }
        }

        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        renderPieces();
        animate();
    </script>
</body>
</html>
